<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#0b1a2a;color:#fff;font-family:"IBM Plex Sans",sans-serif;position:relative;
background-image:linear-gradient(rgba(160,196,224,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(160,196,224,.16) 1px,transparent 1px),linear-gradient(rgba(160,196,224,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(160,196,224,.06) 1px,transparent 1px);
background-size:160px 160px,160px 160px,32px 32px,32px 32px;background-position:-1px -1px}
.in{position:absolute;inset:64px 72px 0 72px}
.logo{display:flex;align-items:center;gap:18px}
.logo svg{width:58px;height:64px}
.n{font-family:Archivo;font-stretch:122%;font-weight:800;font-size:30px;text-transform:uppercase;line-height:1}
.s{font-family:"IBM Plex Mono";font-weight:500;font-size:15px;letter-spacing:.42em;color:#2ec5ce;text-transform:uppercase;margin-top:8px}
h1{font-family:Archivo;font-stretch:115%;font-weight:780;font-size:66px;line-height:1.04;letter-spacing:-.015em;margin:70px 0 0;max-width:820px}
h1 span{color:#2ec5ce}
.specs{display:flex;margin-top:40px;border:1px solid rgba(160,196,224,.28);width:fit-content}
.specs div{padding:14px 22px;font-family:"IBM Plex Mono";font-size:18px;color:rgba(255,255,255,.85)}
.specs div+div{border-left:1px solid rgba(160,196,224,.28)}
.specs b{display:block;font-size:12px;letter-spacing:.16em;color:#2ec5ce;text-transform:uppercase}
.scale{position:absolute;left:0;right:0;bottom:0;height:22px;background-image:repeating-linear-gradient(90deg,#2ec5ce 0 1px,transparent 1px 80px),repeating-linear-gradient(90deg,rgba(160,196,224,.5) 0 1px,transparent 1px 16px);background-size:100% 22px,100% 11px;background-repeat:no-repeat;border-top:1px solid rgba(160,196,224,.3)}
.tel{position:absolute;right:72px;top:72px;font-family:"IBM Plex Mono";font-size:22px;color:#fff}
.big{position:absolute;right:40px;bottom:40px;width:300px;opacity:.95}
</style></head><body>
<div class="in">
<div class="logo"><svg viewBox="0 0 40 44"><path fill="#fff" fill-rule="evenodd" d="M8 3h24c-4.5 9.5-4.5 17.5 2 28H6c6.5-10.5 6.5-18.5 2-28ZM18.4 27.5V18.6H14L20 10.8l6 7.8h-4.4v8.9Z"/><path d="M3 36c2.8 0 2.8-2 5.7-2s2.8 2 5.7 2 2.8-2 5.6-2 2.9 2 5.7 2 2.8-2 5.7-2 2.8 2 5.6 2M3 41.2h34" fill="none" stroke="#2ec5ce" stroke-width="2.6"/></svg>
<div><div class="n">Cooling Tower</div><div class="s">Treatment</div></div></div>
<h1>Cooling tower water treatment, <span>done properly.</span></h1>
<div class="specs"><div><b>Guidance</b>ACOP L8</div><div><b>Technical</b>HSG274 Part 1</div><div><b>Coverage</b>London &amp; nationwide</div></div>
</div>
<div class="tel">020 3633 6064</div>
<svg class="big" viewBox="0 0 40 44"><path fill="none" stroke="rgba(160,196,224,.35)" stroke-width=".35" d="M8 3h24c-4.5 9.5-4.5 17.5 2 28H6c6.5-10.5 6.5-18.5 2-28ZM18.4 27.5V18.6H14L20 10.8l6 7.8h-4.4v8.9Z"/><path d="M3 36c2.8 0 2.8-2 5.7-2s2.8 2 5.7 2 2.8-2 5.6-2 2.9 2 5.7 2 2.8-2 5.7-2 2.8 2 5.6 2" fill="none" stroke="rgba(46,197,206,.6)" stroke-width=".5"/></svg>
<div class="scale"></div>
</body></html>
